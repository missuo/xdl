<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- XDL app icon — full preview (background + glyph combined).
       For Icon Composer, import xdl-icon-background.svg and
       xdl-icon-glyph.svg as separate layers instead. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F9"/>
      <stop offset="1" stop-color="#D9D9DE"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A52"/>
      <stop offset="1" stop-color="#1F1F24"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <path d="M 585 130 L 330 570 L 480 570 L 430 894 L 705 430 L 545 430 Z"
        fill="url(#bolt)" stroke="url(#bolt)" stroke-width="36"
        stroke-linejoin="round" filter="url(#drop)"/>
</svg>
