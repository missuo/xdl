<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- XDL app icon: an X whose rising stroke is a lightning bolt, in black and white. Preview with the rounded square, for Windows, Linux and the extension. -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2A2A2E"/><stop offset="0.55" stop-color="#121214"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.47" r="0.42">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#E4E4EA"/><stop offset="1" stop-color="#A8A8B3"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6D6DC"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#halo)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  <g filter="url(#shadow)">
    <path d="M 300 270 L 420 270 L 724 754 L 604 754 Z" fill="url(#bar)"/>
    <path d="M 655 250 L 760 250 L 560 492 L 660 492 L 300 784 L 462 540 L 362 540 Z" fill="none" stroke="#0B0B0D" stroke-width="34" stroke-linejoin="round"/>
    <path d="M 655 250 L 760 250 L 560 492 L 660 492 L 300 784 L 462 540 L 362 540 Z" fill="url(#bolt)" filter="url(#glow)" opacity="0.7"/>
    <path d="M 655 250 L 760 250 L 560 492 L 660 492 L 300 784 L 462 540 L 362 540 Z" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
