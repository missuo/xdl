name: Release

# Push a tag like v2.0.0 to build, sign and notarize the macOS app, build the
# Windows app, the CLI for every platform and the Docker image, and publish
# them in one GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  macos:
    # Xcode 26+ compiles the Icon Composer AppIcon.icon.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i '' "s/\"version\": *\"[^\"]*\"/\"version\": \"$VERSION\"/" mygo.json

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain > /dev/null
          rm -f cert.p12
          SIGN_ID="$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$SIGN_ID" ] || { echo "no Developer ID Application identity found" >&2; exit 1; }
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Build and sign the app
        run: |
          set -euo pipefail
          go tool mygo build -platform darwin/universal -sign "$SIGN_ID" -skip-notarize
          APP="$(ls -d build/darwin-universal/*.app)"
          codesign --verify --deep --strict "$APP"
          # Authority lines only appear at verbosity 2+ (-dvv, not -dv).
          codesign -dvv "$APP" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "the app is not Developer ID signed" >&2; exit 1; }

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$(ls -d build/darwin-universal/*.app)"
          DMG="$(ls build/darwin-universal/*.dmg)"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler staple "$APP"
          spctl -a -t exec -vv "$APP"
          mkdir -p dist
          cp "$DMG" "dist/XDL-$VERSION-macos.dmg"
          ditto -c -k --keepParent "$APP" "dist/XDL-$VERSION-macos.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  windows-cli-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"$VERSION\"/" mygo.json
      - name: Test
        run: make test
      - name: Windows app and installer
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          go tool mygo build -platform windows/amd64
      - name: CLI for every platform
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/missuo/xdl/internal/version.Version=$VERSION" \
              -o "dist/xdl-$VERSION-$os-$arch$ext" ./cmd/xdl
          done
      - name: Collect
        run: |
          cp build/windows-amd64/*-setup-*.exe "dist/XDL-$VERSION-windows-setup.exe"
          (cd extension && zip -r "../dist/xdl-chrome-extension-$VERSION.zip" chrome)
      - uses: actions/upload-artifact@v7
        with:
          name: windows-cli-extension
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push .

  release:
    needs: [macos, windows-cli-extension, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "XDL $GITHUB_REF_NAME" --generate-notes
