name: Release

# Push a tag like v2.0.0 to publish one GitHub Release with:
#   - the desktop app (GUI) for macOS (universal, signed and notarized),
#     Windows (amd64, arm64: installer + portable exe) and Linux (amd64,
#     arm64: .deb, tarball with install.sh)
#   - the `xdl` CLI for macOS, Linux and Windows (amd64, arm64)
#   - the Chrome extension
#   - the Docker image (ghcr.io, linux/amd64 + linux/arm64)
# MyGo needs no cgo, so everything but the macOS app cross-compiles on Linux;
# the macOS app needs a Mac for its Icon Composer icon, signing and
# notarization.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  # The newest Go; go.mod sets the minimum.
  GO_VERSION: stable

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Set the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i '' "s/\"version\": *\"[^\"]*\"/\"version\": \"$VERSION\"/" mygo.json

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain > /dev/null
          rm -f cert.p12
          SIGN_ID="$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$SIGN_ID" ] || { echo "no Developer ID Application identity found" >&2; exit 1; }
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Build and sign the app
        run: |
          set -euo pipefail
          go tool mygo build -platform darwin/universal -sign "$SIGN_ID" -skip-notarize
          APP="$(ls -d build/darwin-universal/*.app)"
          codesign --verify --deep --strict "$APP"
          # Authority lines only appear at verbosity 2+ (-dvv, not -dv).
          codesign -dvv "$APP" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "the app is not Developer ID signed" >&2; exit 1; }

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$(ls -d build/darwin-universal/*.app)"
          DMG="$(ls build/darwin-universal/*.dmg)"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler staple "$APP"
          spctl -a -t exec -vv "$APP"
          mkdir -p dist
          cp "$DMG" "dist/XDL-$VERSION-macos-universal.dmg"
          ditto -c -k --keepParent "$APP" "dist/XDL-$VERSION-macos-universal.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Set the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"$VERSION\"/" mygo.json

      - name: Test
        run: make test

      - name: Desktop app for Windows and Linux
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y nsis
          go tool mygo build -platform windows/amd64,windows/arm64,linux/amd64,linux/arm64
          mkdir -p dist
          for arch in amd64 arm64; do
            cp build/windows-$arch/*-setup-*.exe "dist/XDL-$VERSION-windows-$arch-setup.exe"
            (cd build/windows-$arch && zip -qr "../../dist/XDL-$VERSION-windows-$arch-portable.zip" XDL.exe chrome)
            cp build/linux-$arch/*.deb "dist/xdl_${VERSION}_linux_$arch.deb"
            cp build/linux-$arch/*.tar.gz "dist/XDL-$VERSION-linux-$arch.tar.gz"
          done

      - name: CLI for every platform
        run: |
          set -euo pipefail
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/missuo/xdl/internal/version.Version=$VERSION" \
              -o "cli/xdl$ext" ./cmd/xdl
            if [ "$os" = windows ]; then
              (cd cli && zip -q "../dist/xdl-cli-$VERSION-$os-$arch.zip" "xdl$ext")
            else
              tar -C cli -czf "dist/xdl-cli-$VERSION-$os-$arch.tar.gz" xdl
            fi
            rm -f "cli/xdl$ext"
          done

      - name: Chrome extension
        run: |
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"$VERSION\"/" extension/chrome/manifest.json
          (cd extension/chrome && zip -qr "../../dist/xdl-chrome-extension-$VERSION.zip" .)

      - uses: actions/upload-artifact@v7
        with:
          name: cross
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push .

  release:
    needs: [macos, cross, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "XDL $GITHUB_REF_NAME" --generate-notes
